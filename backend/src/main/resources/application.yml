server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/word_assistant?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}          # 本地开发口令不入库；用环境变量注入
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

cors:
  allowed-origins: "http://localhost:5173"
