# ============================================================
# 绿色版 (standalone) 配置: 内置 H2 文件数据库, 免装 MySQL
# 启动方式: java -jar ai-word-assistant.jar --spring.profiles.active=standalone
# 数据保存在运行目录下的 data/ 文件夹, 可随文件夹整体迁移备份
# ============================================================
server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:file:./data/word_assistant;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    username: sa
    password: ""
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

cors:
  allowed-origins: "http://localhost:5173"
